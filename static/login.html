<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Acceder · Finanzas Sociedad</title>
<link rel="stylesheet" href="style.css">
<style>
  body { display:flex; align-items:center; justify-content:center; min-height:100vh; background:var(--bg); }
  .login-wrap { width:100%; max-width:360px; padding:1rem; }
  .login-logo { display:flex; align-items:center; gap:10px; margin-bottom:2rem; justify-content:center; }
  .login-card { background:var(--surface); border:0.5px solid var(--border); border-radius:var(--radius-lg); padding:2rem; }
  .login-title { font-size:18px; font-weight:600; letter-spacing:-.3px; margin-bottom:1.5rem; text-align:center; }
  .tab-toggle { display:flex; border-radius:var(--radius); overflow:hidden; border:0.5px solid var(--border-md); margin-bottom:1.5rem; }
  .tab-btn { flex:1; padding:8px; font-size:13px; cursor:pointer; border:none; background:var(--bg); color:var(--text-2); font-family:inherit; transition:.13s; }
  .tab-btn.active { background:var(--surface); color:var(--text); font-weight:500; }
  .err-msg { font-size:12px; color:var(--gas); background:var(--gas-bg); border-radius:6px; padding:8px 10px; margin-top:.75rem; display:none; }
  .ok-msg  { font-size:12px; color:var(--ing); background:var(--ing-bg); border-radius:6px; padding:8px 10px; margin-top:.75rem; display:none; }
</style>
</head>
<body>
<div class="login-wrap">
  <div class="login-logo">
    <span class="logo-mark">S</span>
    <span class="logo-text">Finanzas Sociedad</span>
  </div>
  <div class="login-card">
    <div class="tab-toggle">
      <button class="tab-btn active" id="tab-login" onclick="showTab('login')">Acceder</button>
      <button class="tab-btn" id="tab-reg" onclick="showTab('register')">Crear cuenta</button>
    </div>

    <!-- Login -->
    <div id="panel-login">
      <div class="login-title">Bienvenido</div>
      <div class="form-group">
        <label for="l-user">Usuario</label>
        <input type="text" id="l-user" placeholder="tu_usuario" autocomplete="username">
      </div>
      <div class="form-group">
        <label for="l-pass">Contraseña</label>
        <input type="password" id="l-pass" placeholder="••••••••" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()">
      </div>
      <div class="form-actions" style="margin-top:1.25rem">
        <button class="btn-primary" style="width:100%" onclick="doLogin()">Acceder</button>
      </div>
      <div class="err-msg" id="l-err"></div>
    </div>

    <!-- Register -->
    <div id="panel-register" style="display:none">
      <div class="login-title">Crear cuenta</div>
      <div class="form-group">
        <label for="r-user">Usuario</label>
        <input type="text" id="r-user" placeholder="tu_usuario" autocomplete="username">
      </div>
      <div class="form-group">
        <label for="r-pass">Contraseña</label>
        <input type="password" id="r-pass" placeholder="Mínimo 6 caracteres" autocomplete="new-password">
      </div>
      <div class="form-group">
        <label for="r-pass2">Repite la contraseña</label>
        <input type="password" id="r-pass2" placeholder="••••••••" autocomplete="new-password" onkeydown="if(event.key==='Enter')doRegister()">
      </div>
      <div class="form-actions" style="margin-top:1.25rem">
        <button class="btn-primary" style="width:100%" onclick="doRegister()">Crear cuenta</button>
      </div>
      <div class="err-msg" id="r-err"></div>
      <div class="ok-msg"  id="r-ok"></div>
    </div>
  </div>
</div>

<script>
function showTab(t) {
  document.getElementById('panel-login').style.display    = t==='login'    ? '' : 'none';
  document.getElementById('panel-register').style.display = t==='register' ? '' : 'none';
  document.getElementById('tab-login').classList.toggle('active', t==='login');
  document.getElementById('tab-reg').classList.toggle('active', t==='register');
}

async function doLogin() {
  const username = document.getElementById('l-user').value.trim();
  const password = document.getElementById('l-pass').value;
  const err = document.getElementById('l-err');
  err.style.display = 'none';
  if (!username || !password) { showErr(err, 'Completa todos los campos.'); return; }
  const resp = await fetch('/api/auth/login', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({username, password})
  });
  const data = await resp.json();
  if (resp.ok) { window.location.href = '/'; }
  else showErr(err, data.error || 'Error al acceder.');
}

async function doRegister() {
  const username = document.getElementById('r-user').value.trim();
  const password = document.getElementById('r-pass').value;
  const password2= document.getElementById('r-pass2').value;
  const err = document.getElementById('r-err');
  const ok  = document.getElementById('r-ok');
  err.style.display = ok.style.display = 'none';
  if (!username || !password) { showErr(err, 'Completa todos los campos.'); return; }
  if (password !== password2) { showErr(err, 'Las contraseñas no coinciden.'); return; }
  const resp = await fetch('/api/auth/register', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({username, password})
  });
  const data = await resp.json();
  if (resp.ok) {
    ok.textContent = 'Cuenta creada. Ahora accede con tus datos.';
    ok.style.display = 'block';
    setTimeout(() => showTab('login'), 1500);
  } else showErr(err, data.error || 'Error al registrar.');
}

function showErr(el, msg) { el.textContent = msg; el.style.display = 'block'; }
</script>
</body>
</html>
